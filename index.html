<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexMart - Modern E-Commerce Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      // Initialize EmailJS with your Public Key
      emailjs.init("kR99j_G63iMQWnNeB");
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .animate-slide-in {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- CONFIGURATION: EmailJS Credentials ---
    const EMAILJS_SERVICE_ID  = "service_y8sw1vp";
    const EMAILJS_TEMPLATE_ID = "template_tvj0hnq";
    const EMAILJS_PUBLIC_KEY  = "O4NcARBct5jmvrbGe";

    // --- INITIAL CATALOG DATA ---
    const INITIAL_PRODUCTS = [
      {
        id: 'p1',
        name: 'ApexPro Wireless ANC Headphones',
        category: 'Electronics',
        price: 8999,
        stock: 24,
        rating: 4.8,
        reviewsCount: 142,
        image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80',
        description: 'Active Noise Cancellation with high-resolution wireless audio driver and 30-hour battery life.'
      },
      {
        id: 'p2',
        name: 'Aura Minimalist Smart Watch v2',
        category: 'Wearables',
        price: 12499,
        stock: 15,
        rating: 4.6,
        reviewsCount: 89,
        image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80',
        description: 'Sleek stainless steel frame, Sapphire display, heart rate/SpO2 sensors with 7-day battery life.'
      },
      {
        id: 'p3',
        name: 'ErgoType RGB Mechanical Keyboard',
        category: 'Electronics',
        price: 5499,
        stock: 8,
        rating: 4.9,
        reviewsCount: 210,
        image: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80',
        description: 'Hot-swappable tactile switches, per-key RGB backlighting, and detachable Type-C cable.'
      },
      {
        id: 'p4',
        name: 'Nomad Canvas Travel Backpack 30L',
        category: 'Fashion',
        price: 3299,
        stock: 30,
        rating: 4.5,
        reviewsCount: 64,
        image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80',
        description: 'Water-resistant heavy-duty canvas with padded 16-inch laptop compartment.'
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('apex_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('apex_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('apex_cart');
        return saved ? JSON.parse(saved) : [];
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('apex_orders');
        return saved ? JSON.parse(saved) : [];
      });

      const [activePage, setActivePage] = useState('store');
      const [authMode, setAuthMode] = useState('login');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      const [checkoutForm, setCheckoutForm] = useState({ phone: '', address: '' });
      const [isProcessingPayment, setIsProcessingPayment] = useState(false);

      useEffect(() => { localStorage.setItem('apex_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('apex_cart', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem('apex_orders', JSON.stringify(orders)); }, [orders]);
      useEffect(() => {
        if (currentUser) localStorage.setItem('apex_user', JSON.stringify(currentUser));
        else localStorage.removeItem('apex_user');
      }, [currentUser]);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // AUTHENTICATION & EMAIL DISPATCH
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        const emailClean = authEmail.trim().toLowerCase();

        if (authMode === 'login') {
          let role = 'customer';
          let name = emailClean.split('@')[0];
          if (emailClean === 'admin@apexmart.com' || emailClean.startsWith('admin')) {
            role = 'admin';
            name = 'Administrator';
          }
          const user = { email: emailClean, role, name };
          setCurrentUser(user);
          showToast(`Welcome back, ${name}!`);
          setActivePage(role === 'admin' ? 'admin' : 'store');
        } else {
          const newUser = {
            email: emailClean,
            name: authName.trim() || emailClean.split('@')[0],
            role: emailClean.includes('admin') ? 'admin' : 'customer'
          };

          try {
            if (window.emailjs && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
              await window.emailjs.send(
                EMAILJS_SERVICE_ID,
                EMAILJS_TEMPLATE_ID,
                {
                  to_email: newUser.email,
                  to_name: newUser.name,
                  signup_date: new Date().toLocaleDateString(),
                  message: 'Welcome to ApexMart!'
                },
                EMAILJS_PUBLIC_KEY
              );
              showToast(`Welcome email dispatched to ${newUser.email}`);
            } else {
              showToast(`Account created for ${newUser.email}!`);
            }
          } catch (err) {
            showToast(`Account created! (Email service error)`, 'error');
          }

          setCurrentUser(newUser);
          setActivePage(newUser.role === 'admin' ? 'admin' : 'store');
        }
        setAuthLoading(false);
      };

      const addToCart = (product) => {
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
        showToast(`Added ${product.name} to cart.`);
      };

      const cartSubtotal = useMemo(() => cart.reduce((sum, item) => sum + item.price * item.quantity, 0), [cart]);

      const handleCheckout = () => {
        if (!currentUser) {
          showToast('Please login to complete your purchase.', 'error');
          setActivePage('auth');
          return;
        }
        setIsProcessingPayment(true);
        setTimeout(() => {
          const orderId = 'order_rzp_' + Math.random().toString(36).substr(2, 9);
          const paymentId = 'pay_' + Math.random().toString(36).substr(2, 12);
          const newOrder = {
            id: orderId,
            paymentId: paymentId,
            date: new Date().toISOString(),
            items: [...cart],
            totalAmount: cartSubtotal,
            status: 'Paid'
          };
          setOrders((prev) => [newOrder, ...prev]);
          setCart([]);
          setIsProcessingPayment(false);
          setIsCartOpen(false);
          showToast(`Payment Successful! Razorpay ID: ${paymentId}`);
          setActivePage('orders');
        }, 1500);
      };

      return (
        <div className="min-h-screen flex flex-col bg-gray-50">
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl text-white text-sm ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
              {toast.message}
            </div>
          )}

          <header className="bg-white border-b sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <span className="text-xl font-bold text-indigo-600 cursor-pointer" onClick={() => setActivePage('store')}>ApexMart</span>
              <div className="flex gap-4 items-center">
                <button onClick={() => setActivePage('store')} className="text-sm font-medium">Store</button>
                {currentUser?.role === 'admin' ? (
                  <button onClick={() => setActivePage('admin')} className="text-sm font-medium text-purple-600">Admin Portal</button>
                ) : (
                  currentUser && <button onClick={() => setActivePage('orders')} className="text-sm font-medium">Orders</button>
                )}
                <button onClick={() => setIsCartOpen(true)} className="p-2 relative bg-gray-100 rounded-lg">
                  🛍️ <span className="text-xs font-bold">{cart.length}</span>
                </button>
                {currentUser ? (
                  <button onClick={() => { setCurrentUser(null); setActivePage('store'); }} className="text-xs text-red-600 border px-2 py-1 rounded">Logout</button>
                ) : (
                  <button onClick={() => setActivePage('auth')} className="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg">Login</button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-6 flex-1 w-full">
            {activePage === 'store' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {products.map((p) => (
                  <div key={p.id} className="bg-white p-4 rounded-xl border shadow-sm flex flex-col justify-between">
                    <img src={p.image} className="h-40 w-full object-cover rounded-lg mb-3" />
                    <div>
                      <h3 className="font-bold text-gray-900">{p.name}</h3>
                      <p className="text-xs text-gray-500 mt-1">{p.description}</p>
                    </div>
                    <div className="mt-4 flex items-center justify-between">
                      <span className="font-bold text-lg">₹{p.price}</span>
                      <button onClick={() => addToCart(p)} className="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg">Add to Cart</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activePage === 'auth' && (
              <div className="max-w-md mx-auto my-10 bg-white p-6 rounded-xl border shadow-md">
                <h2 className="text-xl font-bold mb-4">{authMode === 'login' ? 'Login' : 'Sign Up'}</h2>
                <form onSubmit={handleAuthSubmit} className="space-y-3">
                  {authMode === 'signup' && (
                    <input type="text" placeholder="Full Name" required value={authName} onChange={(e) => setAuthName(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
                  )}
                  <input type="email" placeholder="Email" required value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
                  <input type="password" placeholder="Password" required value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full p-2 border rounded-lg text-sm" />
                  <button type="submit" disabled={authLoading} className="w-full py-2 bg-indigo-600 text-white rounded-lg font-medium text-sm">
                    {authLoading ? 'Please wait...' : authMode === 'login' ? 'Sign In' : 'Register Account'}
                  </button>
                </form>
                <div className="mt-4 text-center">
                  <button onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')} className="text-xs text-indigo-600 underline">
                    {authMode === 'login' ? "Need an account? Sign Up" : "Already have an account? Login"}
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
